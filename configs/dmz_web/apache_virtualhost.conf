# ==============================================================================
# Configuration Apache VirtualHost - Serveur Web DMZ Publique
# Machine: 172.16.100.80
# Rôle: Exposition Web sécurisée & Réception Port Forwarding OPNsense (R7)
# ==============================================================================

<VirtualHost *:80>
    ServerAdmin admin@mon-entreprise.lan
    ServerName web.mon-entreprise.lan
    DocumentRoot /var/www/html

    # Redirection stricte vers HTTPS pour tous les flux HTTP entrants
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/web_dmz_error.log
    CustomLog ${APACHE_LOG_DIR}/web_dmz_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@mon-entreprise.lan
    ServerName web.mon-entreprise.lan
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    # Durcissement des protocoles SSL/TLS
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # En-têtes de sécurité HTTP
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog ${APACHE_LOG_DIR}/web_dmz_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/web_dmz_ssl_access.log combined
</VirtualHost>

