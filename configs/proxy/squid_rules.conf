# ==============================================================================
# Configuration Squid Web Proxy - OPNsense (Services > Web Proxy)
# Port d'écoute : 3128
# Politiques implémentées : Quota 20Mo (R13) et Blacklist Réseaux Sociaux (R12)
# ==============================================================================

# Port et interface d'écoute
http_port 192.168.100.254:3128

# ACL des réseaux autorisés
acl localnet src 192.168.100.0/24    # Réseau LAN
acl admin_pc src 192.168.100.20      # Poste d'administration

# ACL de ports sécurisés standards
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl CONNECT method CONNECT

# Règle R12 : Définition de la liste noire de noms de domaines
acl blacklist_domains dstdomain .facebook.com .twitter.com .x.com .whatsapp.com .youtube.com

# Règle R13 : Quota maximal de téléchargement fixé à 20 Mo (20971520 octets)
reply_body_max_size 20971520 allow localnet !admin_pc

# Application du contrôle d'accès
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Blocage de la blacklist
http_access deny blacklist_domains

# Autorisation de navigation pour le réseau local
http_access allow localnet
http_access allow localhost

# Blocage par défaut
http_access deny all

# En-tête masquant l'empreinte logicielle
visible_hostname opnsense.internal
httpd_suppress_version_string on

